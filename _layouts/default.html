<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar" aria-label="Profile and navigation">
        <div class="headshot" role="img" aria-label="Headshot placeholder">
          <span>Headshot</span>
        </div>
        <nav class="profile-links" aria-label="Main navigation">
          <a href="{{ '/resume.pdf' | relative_url }}">Resume</a>
          <a href="{{ '/posts/' | relative_url }}">Blog</a>
        </nav>
      </aside>
      <main class="content">
        {{ content }}
      </main>
    </div>
  </body>
</html>
